[project]
name = "eda-data-quality-pipeline"
version = "0.1.0"
description = "Pipeline reproducible de EDA y calidad de datos para practicar ciencia de datos y desarrollo agentico."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "pandera>=0.20",
    "plotly>=5.24",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
